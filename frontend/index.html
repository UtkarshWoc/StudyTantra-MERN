<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app-theme') || 'dark';
          var resolved = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/study.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/study.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <title>StudyTantra — AI Spaced Recall & Learning Intelligence</title>
  </head>
  <body class="bg-background font-body text-on-surface antialiased">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14110f;color:#faf5ee;font-family:'Manrope',sans-serif;padding:24px;text-align:center;">
        <div style="width:64px;height:64px;border-radius:18px;background:rgba(194,101,42,0.15);border:1px solid rgba(194,101,42,0.3);display:flex;align-items:center;justify-content:center;color:#f0a878;margin-bottom:20px;box-shadow:0 0 24px rgba(194,101,42,0.2);">
          <span class="material-symbols-outlined" style="font-size:32px;">local_library</span>
        </div>
        <h1 style="font-family:'EB Garamond',serif;font-size:32px;font-weight:700;margin:0 0 4px 0;letter-spacing:-0.02em;">StudyTantra</h1>
        <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:#f0a878;margin:0 0 24px 0;">AI Spaced Recall & Neural Intelligence</p>
        <div style="width:36px;height:36px;border:3px solid rgba(194,101,42,0.2);border-top-color:#c2652a;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px;"></div>
        <p style="font-size:12px;color:#a89f97;margin:0;">Initializing learning environment...</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
